spring:
  application:
    name: auth-service
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_AUTH_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false

token:
  expiration:
    access-minutes: 10
    refresh-days: 7
  access:
    secret: ${ACCESS_TOKEN_JWT_SECRET}

camunda:
  client:
    mode: self-managed

server:
  error:
    include-stacktrace: never
  port: 80

eureka:
  client:
    webclient:
      enabled: false