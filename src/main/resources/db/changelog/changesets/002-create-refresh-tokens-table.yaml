databaseChangeLog:
  - changeSet:
      id: 2
      author: Yury Brazgunou
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: token
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: token_user_id_fk
                    nullable: false
                    references: user_credentials(id)
                    deleteCascade: true
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false